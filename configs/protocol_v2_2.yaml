  average_labels_across_sources: false
  encode_source_as_model_input: false
model:
  name: MD-SOP-BiLSTM-window-v2.2
  input_layer_norm_dimension: 1182
  projection:
    output_dimension: 128
    activation: GELU
    dropout: 0.1
  recurrent_backbone:
    type: BiLSTM
    full_sequence_once: true
    layers: 2
    hidden_size_per_direction: 256
    bidirectional: true
    inter_layer_dropout: 0.2
    packed_sequences: true
    output_dimension: 512
  heads:
    window_1:
      window_size: 1
      hidden_projection: Linear(512,128)
      activation: GELU
      dropout: 0.2
      output: Linear(128,1)
      expected_trainable_parameters: 2587069
    window_15:
      window_size: 15
      left_context: 7
      right_context: 7
      boundary_padding: zero_hidden_vectors
      implementation: Conv1d(512,128,kernel_size=15,padding=7)
      activation: GELU
      dropout: 0.2
      output: Conv1d(128,1,kernel_size=1)
      expected_trainable_parameters: 3504573
  output_activation: null
  training_prediction_clipping: false
  main_metric_prediction_clipping: false
  prediction_smoothing: false
loss:
  type: SmoothL1
  beta: 0.05
  residue_reduction: mean_over_valid_nonpadding_residues_per_record
  record_reduction: mean_over_records
  mixed_source_loss: 0.5 * mean_MD_record_loss + 0.5 * mean_SOPPE_record_loss
  zero_valid_label_records_in_loss: false
training:
  primary_seed: 20261007
  optional_confirmation_seeds: []
  optional_seeds_must_be_decided_before_any_test_scores: true
  default_ensemble: false
  optimizer:
    name: AdamW
    learning_rate: 0.0001
    weight_decay: 0.0001
    betas:
    - 0.9
    - 0.999
    eps: 1.0e-08
  precision: float32
  batch:
    total_records: 32
    md_only_md_records: 32
    soppe_only_soppe_records: 32
    mixed_md_records: 16
    mixed_soppe_records: 16
    dynamic_padding: true
  virtual_epoch:
    steps_formula: K = ceil(max(N_MD_train, N_SOPPE_train) / 32)
    max_virtual_epochs: 100
    max_optimizer_steps_formula: 100 * K
    deterministic_independent_source_shuffle_cycles: true
    drop_last: false
    cycle_source_queue_to_fill_batch: true
  gradient_clip_global_norm: 1.0
  scheduler:
    name: ReduceLROnPlateau
    mode: min
    patience: 3
    factor: 0.5
    min_learning_rate: 1.0e-06
  early_stopping:
    patience_virtual_epochs: 10
    min_delta: 0.0001
    selection_and_stopping_improvement_rules_are_separate: true
  checkpoints:
    save_best: true
    save_last: true
    best_definition: strict minimum of the experiment selection metric
